<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report section</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous"
        />
        <link rel="stylesheet" href="report.css">
        
         <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        />
  </head>
  <body>
     
      <header class="header nav-header">
     

        <nav class="navbar navbar-expand-lg navbar-light first-navbar">
          
          <div class="page-container first-navbar-content ">
            <a class="navbar-brand fw-bold navlogo" href="#">
              <span class="naira-header">
                <i
                  class="naira fa-solid fa-naira-sign bg-success text-light d-inline-flex justify-content-center align-items-center px-3 py-2"
                ></i>
              </span>

              <span class="brand-text"> NaijaPrice </span>
            </a>

            <form class="form-section d-flex">
              <button class="btn" type="submit">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>

              <input
                class="form-control"
                type="search"
                placeholder="Search items, markets..."
                aria-label="Search"
              />
            </form>

            <div class="d-flex icon-bar">
              <i
                class="wifi fa-solid fa-wifi mx-2 d-inline-flex justify-content-center align-items-center px-3 py-2"
              ></i>

              <i
                class="moon fa-regular fa-moon mx-2 d-inline-flex justify-content-center align-items-center"
              ></i>

              <i
                class="letter fa-solid fa-y bg-success text-light px-3 shadow-lg py-2 d-inline-flex justify-content-center align-items-center"
              >
              </i>
            </div>
          </div>
       
        </nav>

    

        <nav class="second-navbar navbar navbar-expand-lg navbar-light">
              <main class="page-container" >
          <div  >
            <div class="d-flex navbar-collapse" id="navbarNav">
              <ul class="navlinks navbar-nav">
                <li class="nav-item">
                  <a class="nav-link active" href="index.html">
                    <i class="fa-solid fa-border-all"></i>
                    <span class="link-text">Market</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a class="nav-link active" href="compare.html">
                    <i class="fa-solid fa-chart-column"></i>
                    <span class="link-text">Compare</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a class="nav-link active" href="report.html">
                    <i class="fa-regular fa-pen-to-square"></i>
                    <span class="link-text">Report</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a class="nav-link active" href="profile.html">
                    <i class="fa-regular fa-user"></i>
                    <span class="link-text">Profile</span>
                  </a>
                </li>

                <li class="nav-item">
                  <a class="nav-link active" href="admin-section.html">
                    <i class="fa-solid fa-shield"></i>
                    <span class="link-text">Admin</span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
    <main class="report-section">
      

      <div class="text-center report-heading">
        <h5 class="fw-bold pt-4">
          <i class="fa-regular fa-paper-plane"></i>

          <span>Report a Price</span> 
        </h5>

        <p>Help the community with accurate market data</p>
      </div>

    
      <div class="container">
   
          <form class="form-inner">
         

            <div class="" >
              <label for="item" class="form-label fw-bold"> Item </label>

              <div class="item-select">
                

                <select id="item" class="form-select">
                  <option ><span class="item-icon"> 🌾 </span>Local Rice (Ofada)</option>

                  <option>Beans</option>

                  <option>Garri</option>

                  <option>Yam</option>

                  <option>Tomato</option>
                </select>
              </div>
            </div>


            <div class="">
              <label for="price" class="form-label fw-bold"> Price (₦) </label>

              <input
                type="number"
                id="price"
                class="form-control"
                placeholder="e.g. 2500"
              />

              <small class="price-info"> per 50kg bag </small>
            </div>

            

            <div class="row g-3 mb-4">
            

              <div class="col-md-6">
                <label for="city" class="form-label fw-bold"> City </label>

                <select id="city" class="form-select">
                  <option selected>Lagos</option>

                  <option>Abuja</option>

                  <option>Ibadan</option>

                  <option>Abeokuta</option>

                  <option>Benin City</option>
                </select>
              </div>

    
              <div class="col-md-6">
                <label for="market" class="form-label fw-bold"> Market </label>

                <input
                  type="text"
                  id="market"
                  class="form-control"
                  placeholder="e.g. Mile 12"
                />
              </div>
            </div>

            <button type="submit" class="btn submit-btn w-100">
              <i class="fa-regular fa-paper-plane"></i>

              Submit Report
            </button>
          </form>
        </div>
      </div>
    </main>

     <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"
        ></script> 
  </body>
</html>
