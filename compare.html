    <main class="container">

  <div class="page-container"></div>
        <h5 class="price-comparison pt-4 ">

            City Price Comparison</h5>
            <!-- first-section  -->
            <section>
        <div class="d-flex justify-content-between  gap-4 city-item pt-4">
        <div class="item-section">
            <h6>Item</h6>
            <select name="items" id="">
                <option value="items">Local-Rice-(Ofada)</option>
                <option value="items">Imported Rice (Thai)</option>
                <option value="">Brown Beans Oloyin</option>
                <option value="">Garri (White)</option>
                <option value="">Tomato Stew Paste</option>
            </select>
        </div>
        <div class="first-city">
            <h6>City A</h6>
            <select name="city" id="">
                <option value="">Lagos</option>
                <option value="">Benin</option>
                <option value="">Enugu</option>
                <option value="">Ibadan</option>
                <option value="">Kaduna</option>
            </select>

        </div>
        <div class="second-city">
            <h6>City B</h6>
            <select name="" id="">

          
            <option value="">Abuja</option>
            <option value="">Benin</option>
            <option value="">Enugu</option>
            <option value="">Ibadan</option>
            <option value="">Port-harcourt</option>
              </select>
        </div>
        </div>
        </section>
        <!-- second section  -->
        <section>
<div class="d-flex justify-content-between pt-4 gap-4 location-container " >
    <div class="first-location pt-4 ps-3">
        <h5><span><i class="fa-solid fa-location-dot"></i></span>Lagos</h5>
        <h3><span><i
                class=" fa-solid fa-naira-sign naira-sign "></i></span>932
<span>/50kg bag</span></h3>
<p class="pb-4">16 reports</p>
    </div>
    <div class="second-location pt-4 ps-3 ">
       <h5><span><i class="fa-solid fa-location-dot"></i></span>Abuja</h5>
        <h3><span><i
                class=" fa-solid fa-naira-sign naira-sign "></i></span>962
<span>/50kg bag</span></h3>
<p class="pb-4">11 reports</p>
    </div>
</div>
        </section>
<section class="progress-section ">
<div class="d-flex justify-content-between mt-4 mb-0 pt-3 px-3 difference">
        <h6 >Difference</h6>
        <p>0.00%</p>
    </div>
<div class="progress progress-live mx-3 mt-0">
    
  <div class="progress-bar pe-2 " role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
  
</div>
<div class="d-flex justify-content-between px-3 range">
    <p>Lagos higher</p>
    <p>Abuja higher</p>
  </div>
